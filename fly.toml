# Fly.io config. Before the first deploy:
#   fly launch --no-deploy   (or: fly apps create frontrun-timer)
#   fly secrets set SECRET_KEY=$(openssl rand -hex 32)
#   fly secrets set DATABASE_URL=postgres://...   (Neon connection string)
#   fly secrets set COOKIE_SECURE=1
app = "frontrun-timer"
primary_region = "ams"

[build]

[env]
  STATIC_DIR = "/app/static"

[deploy]
  release_command = "uv run --no-sync alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true
  # Off-season posture: scale to zero. The race runs one day a year, so for
  # the other ~364 the app should cost nothing and wake on demand — the first
  # request after a lull pays a few seconds of cold start, which is fine for a
  # stray visitor looking up last year's results.
  #
  # RACE DAY: flip this back to always-on before the event —
  #   auto_stop_machines = "off"  /  min_machines_running = 1
  # plus `fly scale count 2`. A cold start on race day lands on a spectator
  # or, worse, on a timer at the finish line.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    # Fly's default for http_service is connections-based, soft 20 / hard 25.
    # A few hundred spectators polling the results page hold keep-alive
    # connections, so that default would start shedding requests long before
    # the CPU was busy. Count requests instead, with headroom. Harmless while
    # idle, and one less thing to remember on race morning.
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
