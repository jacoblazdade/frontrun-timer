[project]
name = "frontrun-backend"
version = "0.1.0"
description = "Frontrun Timer — race timing backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "passlib>=1.7.4",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "numbers-parser>=4.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter-default DSL (File(...), Form(...), Depends(...)) is fine
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # autogenerated migrations keep their layout

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
